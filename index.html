<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-card">
    <header class="todo-header">
      <div>
        <p class="eyebrow">MY DAY</p>
        <h1>待辦清單</h1>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
      <p class="subtitle">把今天重要的事，一件一件完成。</p>
    </header>

    <form class="todo-form" id="todo-form">
      <label class="visually-hidden" for="todo-input">輸入待辦事項</label>
      <input id="todo-input" name="todo" type="text" placeholder="接下來要做什麼？" autocomplete="off" maxlength="120">
      <button type="submit">新增</button>
    </form>

    <nav class="filter-controls" aria-label="待辦篩選">
      <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </nav>

    <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
    <p class="empty-message" id="empty-message"></p>

    <footer class="todo-footer">
      <span id="remaining-count">未完成：0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
